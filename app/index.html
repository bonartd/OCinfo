<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>OCinfo — Ödünç Cihaz Ofisi</title>
  <meta name="description" content="Ödünç Cihaz Ofisi dijital bilgilendirme ekranı">
  <meta name="theme-color" content="#0b2545">

  <!-- iOS 15 PWA: manifest kısmen okunur, bu etiketler zorunludur (AGENTS.md 3.1) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OCinfo">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="assets/css/app.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">OC</span>
        <div>
          <p class="brand-title">Ödünç Cihaz Ofisi</p>
          <p class="brand-sub">Yaşar Üniversitesi · Bilgi İşlem Müdürlüğü</p>
        </div>
      </div>
      <nav id="dots" class="dots" aria-label="Sayfalar" hidden></nav>
      <div class="topbar-right">
        <span id="offline" class="offline" hidden>Çevrimdışı</span>
        <div id="clock" class="clock" aria-live="off"></div>
      </div>
    </header>

    <main id="stage" class="stage"></main>
  </div>

  <noscript>Bu ekranın çalışması için JavaScript gereklidir.</noscript>
</body>
</html>
